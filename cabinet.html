<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Личный кабинет — RepairWorkshop</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="site-header">
  <div class="container">
    <a href="index.html" class="logo"><span class="logo-mark">🛠️</span> RepairWorkshop</a>
    <ul class="main-menu" id="main-menu">
      <li><a href="index.html">Главная</a></li>
      <li><a href="services.html">Услуги</a></li>
      <li><a href="booking.html">Онлайн-запись</a></li>
    </ul>
    <div class="header-actions" id="header-actions"></div>
    <button class="menu-toggle" onclick="toggleMenu()">☰</button>
  </div>
</header>

<div class="app-layout">
  <aside class="sidebar">
    <div class="side-label">Меню</div>
    <a href="#" class="active" data-tab="overview"><span class="ico">📊</span> Обзор</a>
    <a href="#" data-tab="requests"><span class="ico">📋</span> Мои заявки</a>
    <a href="#" data-tab="profile"><span class="ico">👤</span> Профиль</a>
    <div class="side-label">Действия</div>
    <a href="booking.html"><span class="ico">➕</span> Новая заявка</a>
  </aside>

  <main class="app-main">
    <div id="content"></div>
  </main>
</div>

<script src="js/storage.js"></script>
<script src="js/ui.js"></script>
<script src="js/auth.js"></script>
<script src="js/main.js"></script>
<script>
if (!Auth.requireAuth('login.html')) throw new Error('redirect');
const user = Auth.current();

let currentTab = 'overview';

function render() {
  document.querySelectorAll('.sidebar a[data-tab]').forEach(a => {
    a.classList.toggle('active', a.dataset.tab === currentTab);
  });
  const el = document.getElementById('content');
  if (currentTab === 'overview') return renderOverview(el);
  if (currentTab === 'requests') return renderRequests(el);
  if (currentTab === 'profile') return renderProfile(el);
}

function renderOverview(el) {
  const reqs = DB.getRequestsByClient(user.id);
  const active = reqs.filter(r => !['completed','canceled'].includes(r.status)).length;
  const completed = reqs.filter(r => r.status === 'completed').length;
  const total = reqs.reduce((s,r) => s + (r.finalCost || 0), 0);

  el.innerHTML = `
    <div class="page-head">
      <div>
        <h1>Привет, ${escapeHtml(user.name.split(' ')[0])} 👋</h1>
        <p class="sub">Здесь вы можете следить за статусом ремонта и управлять заявками</p>
      </div>
      <a href="booking.html" class="btn btn-primary">➕ Новая заявка</a>
    </div>

    <div class="grid grid-4">
      <div class="stat-card"><div class="stat-icon">📋</div><div><div class="num">${reqs.length}</div><div class="lbl">Всего заявок</div></div></div>
      <div class="stat-card"><div class="stat-icon amber">⏳</div><div><div class="num">${active}</div><div class="lbl">В работе</div></div></div>
      <div class="stat-card"><div class="stat-icon green">✅</div><div><div class="num">${completed}</div><div class="lbl">Завершено</div></div></div>
      <div class="stat-card"><div class="stat-icon cyan">💰</div><div><div class="num">${total ? formatPrice(total) : '0 ₽'}</div><div class="lbl">Потрачено</div></div></div>
    </div>

    <h2 style="font-size:20px;margin:36px 0 16px">Последние заявки</h2>
    <div id="recent"></div>
  `;

  const recent = reqs.sort((a,b) => new Date(b.createdAt) - new Date(a.createdAt)).slice(0, 3);
  const wrap = document.getElementById('recent');
  if (recent.length === 0) {
    wrap.innerHTML = `<div class="empty"><div class="ico">📭</div><h3>Заявок пока нет</h3><p>Создайте первую заявку — это займёт минуту</p><a href="booking.html" class="btn btn-primary mt-3">Создать заявку</a></div>`;
    return;
  }
  wrap.innerHTML = recent.map(r => requestCardHTML(r)).join('');
}

function renderRequests(el) {
  const reqs = DB.getRequestsByClient(user.id).sort((a,b) => new Date(b.createdAt) - new Date(a.createdAt));
  el.innerHTML = `
    <div class="page-head"><div><h1>Мои заявки</h1><p class="sub">Всего: ${reqs.length}</p></div></div>
    ${reqs.length === 0
      ? `<div class="empty"><div class="ico">📭</div><h3>Заявок нет</h3><a href="booking.html" class="btn btn-primary mt-3">Создать первую</a></div>`
      : reqs.map(r => requestCardHTML(r)).join('')}
  `;
}

function requestCardHTML(r) {
  const s = DB.findServiceById(r.serviceId);
  const emp = r.employeeId ? DB.findUserById(r.employeeId) : null;
  return `
    <div class="card" style="margin-bottom:16px">
      <div class="flex-between mb-3">
        <div class="flex">
          <div class="card-icon" style="width:44px;height:44px;font-size:20px;margin:0">${s ? or(s.icon,'🔧') : '🔧'}</div>
          <div>
            <b style="color:#fff">Заявка #${r.id} — ${s ? escapeHtml(s.title) : 'Услуга'}</b>
            <div class="text-muted" style="font-size:13px">от ${formatDate(r.createdAt)}</div>
          </div>
        </div>
        ${statusBadge(r.status)}
      </div>
      <div class="grid grid-3" style="gap:12px;font-size:13.5px">
        <div><div class="text-muted">Устройство</div><b>${escapeHtml(r.deviceType)} ${escapeHtml(r.brand||'')} ${escapeHtml(r.model||'')}</b></div>
        <div><div class="text-muted">Мастер</div><b>${emp ? escapeHtml(emp.name) : 'Не назначен'}</b></div>
        <div><div class="text-muted">Запись</div><b>${formatDate(r.scheduledAt)}</b></div>
      </div>
      <p class="mt-3 text-soft" style="font-size:13.5px">${escapeHtml(r.problem)}</p>
      <div class="mt-3 flex">
        <button class="btn btn-ghost btn-sm" onclick="showDetails(${r.id})">Подробнее</button>
        ${r.status === 'completed' ? `<button class="btn btn-primary btn-sm" onclick="leaveReview(${r.id})">Оставить отзыв</button>` : ''}
      </div>
    </div>
  `;
}

function showDetails(id) {
  const r = DB.getRequests().find(x => x.id === id);
  if (!r) return;
  const s = DB.findServiceById(r.serviceId);
  const emp = r.employeeId ? DB.findUserById(r.employeeId) : null;

  const timeline = (r.history || []).map((h, i) => {
    const isLast = i === r.history.length - 1;
    return `
      <div class="tl-item ${isLast ? 'active' : 'done'}">
        <div class="dot">${isLast ? '●' : '✓'}</div>
        <b>${statusLabel(h.status)}</b>
        <div class="time">${formatDate(h.at)}</div>
        ${h.comment ? `<div class="comment">${escapeHtml(h.comment)}</div>` : ''}
      </div>
    `;
  }).join('');

  const html = `
    <div class="modal-header">
      <div>
        <h2>Заявка #${r.id}</h2>
        <div class="sub">${s ? escapeHtml(s.title) : ''}</div>
      </div>
      <button class="modal-close" onclick="this.closest('.modal').remove()">×</button>
    </div>
    <div class="mb-3">${statusBadge(r.status)}</div>
    <div style="display:flex;flex-direction:column;gap:10px;font-size:14px;margin-bottom:22px">
      <div class="flex-between"><span class="text-muted">Устройство</span><b>${escapeHtml(r.deviceType)} ${escapeHtml(r.brand||'')} ${escapeHtml(r.model||'')}</b></div>
      <div class="flex-between"><span class="text-muted">Мастер</span><b>${emp ? escapeHtml(emp.name) : 'Не назначен'}</b></div>
      <div class="flex-between"><span class="text-muted">Запись</span><b>${formatDate(r.scheduledAt)}</b></div>
      ${r.finalCost ? `<div class="flex-between"><span class="text-muted">Стоимость</span><b>${formatPrice(r.finalCost)}</b></div>` : ''}
    </div>
    <h3 style="font-size:16px;margin-bottom:14px;color:#fff">История заявки</h3>
    <div class="timeline">${timeline || '<div class="text-muted">Нет данных</div>'}</div>
  `;
  Modal.open(html, { large: true });
}

function leaveReview(requestId) {
  const html = `
    <div class="modal-header">
      <div><h2>Оставить отзыв</h2><div class="sub">Заявка #${requestId}</div></div>
      <button class="modal-close" onclick="this.closest('.modal').remove()">×</button>
    </div>
    <form id="review-form">
      <div class="form-group">
        <label>Оценка</label>
        <div id="stars-input" class="stars" style="font-size:32px;gap:6px;cursor:pointer">
          ${[1,2,3,4,5].map(n => `<span class="star" data-n="${n}" style="cursor:pointer">★</span>`).join('')}
        </div>
      </div>
      <div class="form-group">
        <label>Ваш отзыв</label>
        <textarea class="form-control" id="review-text" rows="4" placeholder="Расскажите о качестве работы" required></textarea>
      </div>
      <button type="submit" class="btn btn-primary btn-block">Отправить отзыв</button>
    </form>
  `;
  const modal = Modal.open(html);
  let rating = 5;
  const stars = modal.querySelectorAll('#stars-input .star');
  const paint = () => stars.forEach((s,i) => s.classList.toggle('on', i < rating));
  paint();
  stars.forEach(s => {
    s.addEventListener('mouseenter', () => stars.forEach((x,i) => x.classList.toggle('on', i < +s.dataset.n)));
    s.addEventListener('mouseleave', paint);
    s.addEventListener('click', () => { rating = +s.dataset.n; paint(); });
  });
  modal.querySelector('#review-form').addEventListener('submit', (e) => {
    e.preventDefault();
    const text = modal.querySelector('#review-text').value.trim();
    if (!text) { Toast.error('Напишите текст отзыва'); return; }
    DB.createReview({ clientId: user.id, requestId, rating, text });
    Modal.close(modal);
    Toast.success('Отзыв отправлен на модерацию', 'Спасибо!');
  });
}

function renderProfile(el) {
  el.innerHTML = `
    <div class="page-head"><div><h1>Профиль</h1><p class="sub">Управление вашим аккаунтом</p></div></div>
    <div class="card" style="max-width:560px">
      <div class="flex mb-4">
        ${avatarHTML(user, 'avatar-lg')}
        <div><b style="font-size:18px;color:#fff">${escapeHtml(user.name)}</b><div class="text-muted">${escapeHtml(user.email)}</div></div>
      </div>
      <form id="profile-form">
        <div class="form-group"><label>Имя</label><input class="form-control" name="name" value="${escapeHtml(user.name)}" required></div>
        <div class="form-group"><label>Email</label><input class="form-control" type="email" name="email" value="${escapeHtml(user.email)}" required></div>
        <div class="form-group"><label>Телефон</label><input class="form-control" name="phone" value="${escapeHtml(user.phone||'')}"></div>
        <button type="submit" class="btn btn-primary">Сохранить</button>
      </form>
    </div>
  `;
  document.getElementById('profile-form').addEventListener('submit', (e) => {
    e.preventDefault();
    const f = e.target;
    DB.updateUser(user.id, { name: f.name.value.trim(), email: f.email.value.trim(), phone: f.phone.value.trim() });
    Toast.success('Профиль обновлён');
    setTimeout(() => location.reload(), 600);
  });
}

document.addEventListener('DOMContentLoaded', () => {
  render();
  document.querySelectorAll('.sidebar a[data-tab]').forEach(a => {
    a.addEventListener('click', (e) => {
      e.preventDefault();
      currentTab = a.dataset.tab;
      render();
    });
  });
});
</script>

</body>
</html>
